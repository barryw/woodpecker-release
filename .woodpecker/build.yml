when:
  - event: [push, pull_request]

labels:
  platform: linux/amd64

steps:
  - name: lint
    image: alpine:3.21
    commands:
      - apk add --no-cache shellcheck > /dev/null 2>&1
      - shellcheck --severity=warning plugin/entrypoint.sh plugin/lib/*.sh

  - name: test
    image: bats/bats:latest
    commands:
      - bats plugin/test/

  - name: test-config-service
    image: golang:1.25-alpine
    environment:
      GOTOOLCHAIN: local
    commands:
      # Mirror the Dockerfile's module bootstrap (go.mod is generated, not
      # committed), then run the config-service unit tests.
      #
      # IMPORTANT: run in an isolated copy, NOT in config-service/src. Woodpecker
      # steps share one workspace volume; the kaniko build-config-service step
      # (--context=config-service, Dockerfile `COPY src/ .` then `go mod init`)
      # runs later against the SAME tree. If we generate go.mod in-place here it
      # gets copied into the build context and the Dockerfile's `go mod init`
      # fails with "go.mod already exists". Building in /tmp keeps src/ pristine.
      - apk add --no-cache git > /dev/null 2>&1
      - cp -r config-service/src /tmp/cs-test
      - cd /tmp/cs-test
      - go mod init woodpecker-config-service
      - go get go.woodpecker-ci.org/woodpecker/v3@v3.13.0
      - go mod tidy
      - go vet ./...
      - go test ./...

  - name: build-plugin-base
    image: gcr.io/kaniko-project/executor:debug
    environment:
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - mkdir -p /kaniko/.docker
      - 'echo "{\"auths\":{\"ghcr.io\":{\"username\":\"barryw\",\"password\":\"$GHCR_TOKEN\"}}}" > /kaniko/.docker/config.json'
      - /kaniko/executor --dockerfile=plugin/Dockerfile --context=plugin --target=base --destination=ghcr.io/barryw/woodpecker-release:latest
    when:
      - event: push
        branch: main
    depends_on: [lint, test]

  - name: build-plugin-go
    image: gcr.io/kaniko-project/executor:debug
    environment:
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - mkdir -p /kaniko/.docker
      - 'echo "{\"auths\":{\"ghcr.io\":{\"username\":\"barryw\",\"password\":\"$GHCR_TOKEN\"}}}" > /kaniko/.docker/config.json'
      - /kaniko/executor --dockerfile=plugin/Dockerfile --context=plugin --target=go --destination=ghcr.io/barryw/woodpecker-release:go
    when:
      - event: push
        branch: main
    depends_on: [lint, test]

  - name: build-config-service
    image: gcr.io/kaniko-project/executor:debug
    environment:
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - mkdir -p /kaniko/.docker
      - 'echo "{\"auths\":{\"ghcr.io\":{\"username\":\"barryw\",\"password\":\"$GHCR_TOKEN\"}}}" > /kaniko/.docker/config.json'
      - /kaniko/executor --dockerfile=config-service/Dockerfile --context=config-service --destination=ghcr.io/barryw/woodpecker-config-service:latest
    when:
      - event: push
        branch: main
    depends_on: [lint, test, test-config-service]

  - name: restart-config-service
    image: bitnami/kubectl:latest
    commands:
      - kubectl rollout restart deployment/woodpecker-config-service -n woodpecker
      - kubectl rollout status deployment/woodpecker-config-service -n woodpecker --timeout=60s
      - echo "Config service restarted with new image"
    when:
      - event: push
        branch: main
    depends_on: [build-config-service]
